# Ajustes do bot que NÃO são segredo. Segredos ficam no .env.
# Depois de editar, reinicie o bot.

geral:
  intervalo_minutos: 45        # de quanto em quanto tempo buscar ofertas novas
  max_posts_por_ciclo: 3       # quantas ofertas entram na fila a cada busca
  espacamento_segundos: 120    # intervalo entre uma publicação e outra
  nao_repetir_dias: 7          # não repetir o mesmo produto dentro desse prazo
  horario_ativo: "08:00-23:00" # só publica nesse intervalo; "" = 24 horas
  fuso: "America/Sao_Paulo"

filtros:
  desconto_minimo: 25          # % mínimo de desconto
  preco_minimo: 0              # 0 = sem limite
  preco_maximo: 0              # 0 = sem limite
  palavras_bloqueadas: []      # ex: [capinha, película]

ia:
  ativa: true
  # Modelo que escreve as chamadas. Opções e preço por milhão de tokens
  # (entrada / saída), tabela de 03/11/2026:
  #   claude-opus-5-5    US$ 4,00 / 20,00   (padrão, melhor qualidade)
  #   claude-sonnet-5-5  US$ 2,00 / 10,00
  #   claude-haiku-5-5   US$ 0,10 /  0,50   (o mais barato)
  modelo: claude-opus-5-5

fontes:
  mercadolivre:
    ativa: true
    paginas: 1                 # páginas de /ofertas por categoria
    categorias: {}             # vazio = todas. Ex: {MLB1648: Informática, MLB1276: Esportes}
  amazon:
    ativa: true
    paginas: 1
    requisicoes_por_ciclo: 4   # páginas de busca por ciclo (rodízio)
    departamentos: {}          # vazio = todas. Ex: {electronics: Eletrônicos, kitchen: Cozinha}
    buscas: []                 # termos extras. Ex: [echo dot, air fryer]
  shopee:
    ativa: true
    limite: 40                 # produtos pedidos à API por ciclo
    buscas: []                 # vazio = destaques. Ex: [fone bluetooth, tênis]
